  - id: add-collection-item
    method: POST
    path: /api/v1.1/collections/add
    title: Add a post to a collection (v1.1)
    description: "Appends one of your own posts to the end of a collection you own. Only `public` or `unlisted` photo, album and video posts can be added. Adding a post that is already there does nothing and still succeeds. To add other accounts' posts, or several posts at once, use [Add posts to a collection](/api/collections#add-collection-items-v1-2)."
