  - id: get-post-collections
    method: GET
    path: /api/v1.2/statuses/{id}/collections
    title: List your collections for a post
    description: "Returns your collections, newest first, each flagged with `contains` (whether this post is in it) and `removed_by_author` (whether the post's author took it out of that collection, so it cannot be added back). Made for an 'add to collection' sheet. Cursor paginated, 20 per page by default."
    compat: pixelfed
    result: collections
    params:
      path:
        - name: id
          type: string
          required: true
          desc: A post you can see.
      query:
        - name: limit
          type: integer
          desc: "1 to 40. Defaults to `20`."
        - name: cursor
          type: string
          desc: "The `meta.next_cursor` of the previous page."
    callout:
      text: "`meta.can_collect` says whether you can add this post to collections at all. When it is `false`, `meta.reason` has the same message [Add posts to a collection](/api/collections#add-collection-items-v1-2) would return."
    returns: "an object with `data`, an array of Collection with `contains` and `removed_by_author` added, and `meta` with `status_id`, `can_collect`, `reason`, `next_cursor` and `prev_cursor`."
    example:
      path: /api/v1.2/statuses/728602264871018496/collections
    responses:
      - status: 200
        body:
          data:
            - id: "691204417380331520"
              title: Harbour mornings
              description: One winter of walks before work
              visibility: public
              sort: oldest
              sensitive: false
              post_count: 14
              max_posts: 1000
              thumbnail:
                status_id: "728341901556629504"
                type: image
                url: https://pixelfed.social/storage/m/_v2/2/pier.jpg
                preview_url: https://pixelfed.social/storage/m/_v2/2/pier_thumb.jpg
                blurhash: UJF}Qo~W9aIV4.xuRjWB00WB-pof
              url: https://pixelfed.social/c/691204417380331520
              is_owner: true
              account:
                id: "2"
                username: dansup
