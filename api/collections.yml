  - id: update-collection
    method: POST
    path: /api/v1.1/collections/update/{id}
    title: Update a collection (v1.1)
    description: "Sets a collection's title, description and visibility. HTML tags are stripped. All three fields are written on every call, so an omitted `title` or `description` is cleared."
    compat: pixelfed
    result: collection
    params:
      path:
        - name: id
          type: string
          required: true
          desc: A collection you own.
      body:
        - name: title
          type: string
          desc: Up to 50 characters.
        - name: description
          type: string
          desc: Up to 500 characters.
        - name: visibility
          type: string
          required: true
          desc: "One of `public`, `private` (followers only) or `draft`."
    callout:
      icon: information-circle
      text: "This endpoint never sets `published_at`, so a collection that was never published stays out of other people's [lists](/api/collections#list-collections) even when its `visibility` is `public`. To create and publish collections with a token, use [Create a collection](/api/collections#create-collection) and [Update a collection](/api/collections#update-collection-v1-2), which publishes a collection as soon as its `visibility` leaves `draft`."
    returns: the updated Collection.
    example:
      path: /api/v1.1/collections/update/691204417380331520
      body:
        title: Harbour mornings
        description: One winter of walks before work
        visibility: public
