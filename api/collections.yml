title: Collections
description: Curated sets of posts that sit on a profile, like an album.
icon: rectangle-stack
section: pixelfed
order: 0
endpoints:
  - id: create-collection
    method: POST
    path: /api/v1.2/collections
    title: Create a collection
    description: "Creates a collection owned by the token's account. HTML tags are stripped from the title and description. A `public` or `private` collection is published straight away, even before it has any posts; a `draft` stays unpublished and only you can see it. Pass `status_ids` to add posts in the same call."
    compat: pixelfed
    result: collection
    params:
      body:
        - name: title
          type: string
          required: true
          desc: Up to 50 characters. Cannot be empty once HTML is stripped.
        - name: description
          type: string
          desc: Up to 500 characters.
        - name: visibility
          type: string
          desc: "One of `public` (the default), `private` (followers only) or `draft`."
        - name: sort
          type: string
          desc: "The order the collection lists its posts in by default: `oldest` (the default) or `recent`. Both go by when each post was added."
        - name: sensitive
          type: boolean
          desc: "Marks the collection as sensitive. Defaults to `false`."
        - name: status_ids
          type: array
          desc: "Up to 40 post IDs to add, with the same rules as [Add posts to a collection](/api/collections#add-collection-items-v1-2)."
    callout:
      text: "Servers with the v1.2 collection endpoints report `features.collections.api_version` as `1.2` in `GET /api/v2.1/config`. Every v1.2 call that changes something needs a token with the `write` scope and the rest need `read`. A token without it gets a 403."
    returns: "the new Collection, with status 201. When `status_ids` was sent it also has a `rejected` array listing each post that could not be added, with the reason."
    example:
      body:
        title: Harbour mornings
        description: One winter of walks before work
        visibility: public
        sort: oldest
        status_ids: ["728341901556629504", "728341901556629511"]
    responses:
      - status: 201
        body:
          id: "691204417380331520"
          title: Harbour mornings
          description: One winter of walks before work
          visibility: public
          sort: oldest
          sensitive: false
          post_count: 1
          max_posts: 1000
          thumbnail:
            status_id: "728341901556629504"
            type: image
            url: https://pixelfed.social/storage/m/_v2/2/pier.jpg
            preview_url: https://pixelfed.social/storage/m/_v2/2/pier_thumb.jpg
            blurhash: UJF}Qo~W9aIV4.xuRjWB00WB-pof
          url: https://pixelfed.social/c/691204417380331520
          is_owner: true
          account:
            id: "2"
            username: dansup
            acct: dansup
            display_name: dansup
            avatar: https://pixelfed.social/storage/avatars/412/760/avatar.jpg
            local: true
          published_at: "2026-02-11T07:05:41.000Z"
          created_at: "2026-02-11T07:05:41.000Z"
          updated_at: "2026-02-11T07:05:41.000Z"
          rejected:
            - status_id: "728341901556629511"
              error: Only public and unlisted posts can be added to collections.
      - status: 422
        body:
          message: The title field is required.
          errors:
            title: [The title field is required.]

  - id: list-own-collections-v1-2
    method: GET
    path: /api/v1.2/collections/self
    title: List your collections
    description: "Returns every collection owned by the token's account, drafts included, newest first. Cursor paginated, 20 per page by default."
    compat: pixelfed
    result: collections
    params:
      query:
        - name: limit
          type: integer
          desc: "1 to 40. Defaults to `20`."
        - name: cursor
          type: string
          desc: "The `meta.next_cursor` of the previous page."
    callout:
      text: "There is no `items` preview like in [the v1.1 list](/api/collections#list-own-collections). Use `thumbnail` for the cover and [List collection posts](/api/collections#list-collection-items-v1-2) for the posts."
    returns: "an object with `data`, an array of Collection, and `meta` with `next_cursor` and `prev_cursor`. `next_cursor` is `null` on the last page."
    example:
      query: { limit: 20 }
    responses:
      - status: 200
        body:
          data:
            - id: "691204417380331520"
              title: Harbour mornings
              description: One winter of walks before work
              visibility: public
              sort: oldest
              sensitive: false
