  - id: list-collection-items
    method: GET
    path: /api/v1.1/collections/items/{id}
    title: List collection posts (v1.1)
    description: "Returns the posts in a collection in their saved order, with the same visibility rules as [Get a collection](/api/collections#get-collection). Posts that were deleted, made private or have no media are skipped, and so are other accounts' posts their author no longer allows in the collection (see [collection settings](/api/collections#update-collection-settings)), so a page can come back shorter than expected."
