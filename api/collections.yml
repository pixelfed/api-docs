            prev_cursor: null
      - status: 404
        body:
          error: Record not found

  - id: add-collection-items-v1-2
    method: POST
    path: /api/v1.2/collections/{id}/items
    title: Add posts to a collection
    description: "Adds up to 40 posts to a collection you own, in the order given. You can add your own `public` or `unlisted` posts and other accounts' `public` posts, local or remote. Only photo, album and video posts can be added, not reblogs. Every post gets its own result, so some can be added while others are rejected. Adding a post that is already there does nothing and still counts as a success."
    compat: pixelfed
    result: result
    params:
      path:
        - name: id
          type: string
          required: true
          desc: A collection you own.
      body:
        - name: status_ids
          type: array
          required: true
          desc: 1 to 40 post IDs.
    callout:
      text: "Another account's post is rejected when either of you blocks the other, when you block its domain, when its author's [collection setting](/api/collections#update-collection-settings) does not allow you, or when the author [removed it](/api/collections#remove-collected-by) from this collection before. A collection holds at most `max_posts` posts: 1000 by default and never more. The instance's limit is also `limits.collections.max_collection_length` in `GET /api/v2.1/config`."
    returns: "an object with `added` (post IDs added now), `existing` (IDs that were already there), `rejected` (each with `status_id` and an `error` you can show) and the updated `collection`. When nothing was added and nothing was already there, the status is 422 with an `error` (the first rejection's) and `rejected`."
    example:
      path: /api/v1.2/collections/691204417380331520/items
      body:
        status_ids: ["728602264871018496", "731877240951128064"]
    responses:
      - status: 200
        body:
          added: ["728602264871018496"]
          existing: []
          rejected:
            - status_id: "731877240951128064"
              error: This account does not allow their posts to be added to collections.
          collection:
            id: "691204417380331520"
            title: Harbour mornings
            description: One winter of walks before work
            visibility: public
            sort: oldest
            sensitive: false
            post_count: 15
            max_posts: 1000
            thumbnail:
              status_id: "728341901556629504"
              type: image
              url: https://pixelfed.social/storage/m/_v2/2/pier.jpg
              preview_url: https://pixelfed.social/storage/m/_v2/2/pier_thumb.jpg
              blurhash: UJF}Qo~W9aIV4.xuRjWB00WB-pof
            url: https://pixelfed.social/c/691204417380331520
            is_owner: true
            account:
              id: "2"
              username: dansup
              acct: dansup
              display_name: dansup
              avatar: https://pixelfed.social/storage/avatars/412/760/avatar.jpg
              local: true
            published_at: "2026-02-11T07:05:41.000Z"
            created_at: "2026-02-11T06:58:20.000Z"
            updated_at: "2026-10-17T09:20:44.000Z"
      - status: 422
        body:
          error: This collection is full. Collections can have up to 1000 posts.
          rejected:
            - status_id: "728602264871018496"
              error: This collection is full. Collections can have up to 1000 posts.
      - status: 404
        body:
          error: Record not found

  - id: remove-collection-item-v1-2
    method: DELETE
    path: /api/v1.2/collections/{id}/items/{status_id}
    title: Remove a post from a collection
    description: "Takes a post out of a collection you own. The post itself is not deleted. Unlike [the v1.1 endpoint](/api/collections#remove-collection-item), you can remove the last post and keep an empty collection."
    compat: pixelfed
    result: result
    params:
      path:
        - name: id
          type: string
          required: true
          desc: A collection you own.
        - name: status_id
          type: string
          required: true
          desc: The post to remove.
    returns: "an object with the `removed` post ID and the updated `collection`. A post that is not in the collection is a 404."
    example:
      path: /api/v1.2/collections/691204417380331520/items/728602264871018496
    responses:
      - status: 200
        body:
          removed: "728602264871018496"
          collection:
            id: "691204417380331520"
            title: Harbour mornings
            description: One winter of walks before work
            visibility: public
            sort: oldest
            sensitive: false
            post_count: 14
            max_posts: 1000
            thumbnail:
              status_id: "728341901556629504"
              type: image
              url: https://pixelfed.social/storage/m/_v2/2/pier.jpg
              preview_url: https://pixelfed.social/storage/m/_v2/2/pier_thumb.jpg
              blurhash: UJF}Qo~W9aIV4.xuRjWB00WB-pof
            url: https://pixelfed.social/c/691204417380331520
