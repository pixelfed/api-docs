  - id: update-post-collections
    method: POST
    path: /api/v1.2/statuses/{id}/collections
    title: Add a post to several collections
    description: "Adds a post to, or takes it out of, several of your collections in one call. Only the collections you list are touched, so it is safe to send just what changed in an 'add to collection' sheet. Removals run first, then additions. A collection in `remove` that does not hold the post is ignored."
    compat: pixelfed
    result: result
    params:
      path:
        - name: id
          type: string
          required: true
          desc: A post you can see.
      body:
        - name: add
          type: array
          desc: "Up to 40 of your collection IDs to add the post to. Required unless `remove` is sent."
        - name: remove
          type: array
          desc: "Up to 40 of your collection IDs to take the post out of. Required unless `add` is sent."
    callout:
      text: "To add a new post to collections while posting, send `collection_ids` (up to 10 of your collections) with `POST /api/v1/statuses`. Collections that cannot take the post are skipped without failing it."
    returns: "an object with `status_id`, `added`, `removed`, `rejected` (each with `collection_id` and an `error`) and `collection_ids`, the IDs of all your collections that hold the post afterwards. `added` also lists collections that already had it. When nothing was added or removed and something was rejected, the status is 422 with the same fields plus an `error`."
    example:
      path: /api/v1.2/statuses/728602264871018496/collections
      body:
        add: ["691204417380331520", "702331908811022336"]
        remove: ["690911342260477952"]
    responses:
      - status: 200
        body:
          status_id: "728602264871018496"
          added: ["691204417380331520", "702331908811022336"]
          removed: ["690911342260477952"]
          rejected: []
          collection_ids: ["691204417380331520", "702331908811022336"]
      - status: 422
        body:
          error: Collection not found.
          status_id: "728602264871018496"
          added: []
          removed: []
          rejected:
            - collection_id: "655019845510029312"
              error: Collection not found.
          collection_ids: ["691204417380331520"]
      - status: 404
        body:
          error: Record not found

  - id: list-collected-by
    method: GET
    path: /api/v1.2/statuses/{id}/collected_by
    title: List collections holding your post
    description: "For the post's author: other accounts' collections that hold this post. Only the collections you are allowed to see are listed, while `meta.total` counts all of them, including private ones and drafts. Cursor paginated, 20 per page by default."
