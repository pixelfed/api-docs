  - id: list-collections-v1-2
    method: GET
    path: /api/v1.2/accounts/{id}/collections
    title: List an account's collections
    description: "Returns an account's collections, newest first. Everyone sees its published `public` collections, followers also see `private` ones, and the owner sees everything including drafts. Cursor paginated, 20 per page by default."
    compat: pixelfed
    result: collections
    params:
      path:
        - name: id
          type: string
          required: true
          desc: The account ID.
      query:
        - name: limit
          type: integer
          desc: "1 to 40. Defaults to `20`."
        - name: cursor
          type: string
          desc: "The `meta.next_cursor` of the previous page."
    callout:
      text: "For a private (locked) account the list is only returned to its followers, the owner and admins. Everyone else gets a 404, and so does anyone the account blocks."
    returns: "an object with `data`, an array of Collection, and `meta` with `next_cursor` and `prev_cursor`. `next_cursor` is `null` on the last page."
    example:
      path: /api/v1.2/accounts/2/collections
      query: { limit: 20 }
    responses:
      - status: 200
        body:
          data:
            - id: "691204417380331520"
              title: Harbour mornings
              description: One winter of walks before work
              visibility: public
              sort: oldest
              sensitive: false
              post_count: 14
              max_posts: 1000
              thumbnail:
                status_id: "728341901556629504"
                type: image
                url: https://pixelfed.social/storage/m/_v2/2/pier.jpg
                preview_url: https://pixelfed.social/storage/m/_v2/2/pier_thumb.jpg
                blurhash: UJF}Qo~W9aIV4.xuRjWB00WB-pof
              url: https://pixelfed.social/c/691204417380331520
              is_owner: false
              account:
                id: "2"
                username: dansup
                acct: dansup
                display_name: dansup
                avatar: https://pixelfed.social/storage/avatars/412/760/avatar.jpg
                local: true
              published_at: "2026-02-11T07:05:41.000Z"
              created_at: "2026-02-11T06:58:20.000Z"
              updated_at: "2026-03-30T06:48:12.000Z"
          meta:
            next_cursor: null
            prev_cursor: null
      - status: 404
        body:
          error: Record not found

  - id: get-collection-v1-2
    method: GET
    path: /api/v1.2/collections/{id}
    title: Get a collection
    description: "Returns one collection. Published `public` collections are visible to anyone with a token, except those of a private (locked) account, which only its followers see. `private` collections are for the owner's followers and drafts are for the owner only. Admins can see all of them, and anyone the owner blocks gets a 404."
    compat: pixelfed
    result: collection
    params:
      path:
        - name: id
          type: string
          required: true
          desc: The collection ID.
    returns: "a Collection. Along with the title, description and visibility it has `sort` (the owner's default order), `sensitive`, `post_count`, `max_posts` (this server's limit per collection), `thumbnail` (the cover, taken from the first post in the collection's own order that everyone can see, or `null`), `is_owner` and the owner's `account` in the [Pixelfed entity](/api/pixelfed-entities) shape. Timestamps are UTC; `published_at` is `null` until the collection is published."
    example:
      path: /api/v1.2/collections/691204417380331520
    responses:
      - status: 200
        body:
          id: "691204417380331520"
          title: Harbour mornings
          description: One winter of walks before work
          visibility: public
          sort: oldest
          sensitive: false
          post_count: 14
          max_posts: 1000
          thumbnail:
            status_id: "728341901556629504"
            type: image
            url: https://pixelfed.social/storage/m/_v2/2/pier.jpg
            preview_url: https://pixelfed.social/storage/m/_v2/2/pier_thumb.jpg
            blurhash: UJF}Qo~W9aIV4.xuRjWB00WB-pof
          url: https://pixelfed.social/c/691204417380331520
          is_owner: false
          account:
            id: "2"
            username: dansup
            acct: dansup
            display_name: dansup
            avatar: https://pixelfed.social/storage/avatars/412/760/avatar.jpg
            local: true
          published_at: "2026-02-11T07:05:41.000Z"
          created_at: "2026-02-11T06:58:20.000Z"
          updated_at: "2026-03-30T06:48:12.000Z"
      - status: 404
        body:
          error: Record not found

  - id: update-collection-v1-2
    method: PATCH
    path: /api/v1.2/collections/{id}
    title: Update a collection
    description: "Changes a collection you own. Only the fields you send are changed, and HTML tags are stripped from the title and description. Moving a collection out of `draft` publishes it if it was never published. `PUT` works the same way."
    compat: pixelfed
    result: collection
    params:
      path:
        - name: id
          type: string
          required: true
          desc: A collection you own.
      body:
        - name: title
          type: string
          desc: Up to 50 characters. Cannot be empty.
        - name: description
          type: string
          desc: "Up to 500 characters. Send `null` or an empty string to clear it."
        - name: visibility
          type: string
          desc: "One of `public`, `private` (followers only) or `draft`."
        - name: sort
          type: string
          desc: "`oldest` or `recent`."
        - name: sensitive
          type: boolean
          desc: Marks the collection as sensitive.
    returns: the updated Collection.
    example:
      path: /api/v1.2/collections/691204417380331520
      body:
        visibility: public
        sort: recent
    responses:
      - status: 200
        body:
          id: "691204417380331520"
          title: Harbour mornings
          description: One winter of walks before work
          visibility: public
          sort: recent
          sensitive: false
          post_count: 14
          max_posts: 1000
          thumbnail:
            status_id: "728602264871018496"
            type: image
            url: https://pixelfed.social/storage/m/_v2/2/breakwater.jpg
            preview_url: https://pixelfed.social/storage/m/_v2/2/breakwater_thumb.jpg
            blurhash: UbG8%Tof00ay~qofRjj[IUWB%Mof-;WBRjay
          url: https://pixelfed.social/c/691204417380331520
          is_owner: true
          account:
            id: "2"
            username: dansup
            acct: dansup
            display_name: dansup
            avatar: https://pixelfed.social/storage/avatars/412/760/avatar.jpg
            local: true
          published_at: "2026-02-11T07:05:41.000Z"
          created_at: "2026-02-11T06:58:20.000Z"
          updated_at: "2026-10-17T09:14:03.000Z"
      - status: 422
        body:
          message: The selected sort is invalid.
          errors:
            sort: [The selected sort is invalid.]
      - status: 404
        body:
          error: Record not found

  - id: delete-collection-v1-2
    method: DELETE
    path: /api/v1.2/collections/{id}
    title: Delete a collection
    description: "Deletes a collection you own. The posts in it are kept; the collection, its list of items and any author removals recorded for it are deleted."
    compat: pixelfed
    result: result
    params:
      path:
        - name: id
          type: string
          required: true
          desc: A collection you own.
    returns: "an object with the collection's `id` and `deleted: true`."
    example:
      path: /api/v1.2/collections/691204417380331520
    responses:
      - status: 200
        body:
          id: "691204417380331520"
          deleted: true
      - status: 404
        body:
          error: Record not found

  - id: list-collection-items-v1-2
    method: GET
    path: /api/v1.2/collections/{id}/items
    title: List collection posts
    description: "Returns a collection's posts, with the same visibility rules as [Get a collection](/api/collections#get-collection-v1-2). Both orders follow the sequence the posts were added in: `oldest` starts with the first post added and `recent` with the latest. Cursor paginated, 20 per page by default."
    compat: pixelfed
    result: posts
    params:
      path:
        - name: id
          type: string
          required: true
          desc: The collection ID.
      query:
        - name: sort
          type: string
          desc: "`oldest` or `recent`. Defaults to the collection's own `sort`."
        - name: limit
          type: integer
          desc: "1 to 40. Defaults to `20`."
        - name: cursor
          type: string
          desc: "The `meta.next_cursor` of the previous page."
    callout:
      text: "Posts are filtered after paging, so a page can be short or even empty while `next_cursor` is still set. Keep going until it is `null`. Skipped posts: deleted ones, ones without media, the owner's posts that are no longer public or unlisted, other accounts' posts that are no longer public, posts whose author and the collection's owner block each other or whose author's [collection setting](/api/collections#update-collection-settings) no longer allows the owner, and posts from accounts you block or mute, domains you block and accounts that block you."
    returns: "an object with `data`, an array of items, and `meta` with `sort`, `next_cursor` and `prev_cursor`. Each item has its own `id`, `added_at` and the post as `status` in the [Pixelfed entity](/api/pixelfed-entities) shape, with `favourited`, `reblogged` and `bookmarked` set for you."
    example:
      path: /api/v1.2/collections/691204417380331520/items
      query: { sort: recent, limit: 20 }
    responses:
      - status: 200
        body:
          data:
            - id: "728602264871018496"
              added_at: "2026-03-30T06:48:12.000Z"
              status:
                _v: 1
                id: "728341901556629504"
                shortcode: W4kQ2pLm
