  - id: remove-collected-by
    method: DELETE
    path: /api/v1.2/statuses/{id}/collected_by/{collection_id}
    title: Remove your post from a collection
    description: "For the post's author: takes this post out of another account's collection. That collection can never add it back. A collection that is yours or does not hold the post is a 404."
    compat: pixelfed
    result: result
    params:
      path:
        - name: id
          type: string
          required: true
          desc: One of your own posts.
        - name: collection_id
          type: string
          required: true
          desc: A collection owned by another account that holds the post.
    returns: "an object with `status_id` and `removed: 1`."
    example:
      path: /api/v1.2/statuses/728341901556629504/collected_by/715560218340229120
    responses:
      - status: 200
        body:
          status_id: "728341901556629504"
          removed: 1
      - status: 404
        body:
          error: Record not found

  - id: remove-all-collected-by
    method: DELETE
    path: /api/v1.2/statuses/{id}/collected_by
    title: Remove your post from every collection
    description: "For the post's author: takes this post out of every collection owned by another account, and none of them can add it back. Your own collections are left alone."
    compat: pixelfed
    result: result
    params:
      path:
        - name: id
          type: string
          required: true
          desc: One of your own posts.
    returns: "an object with `status_id` and `removed`, the number of collections the post was taken out of."
    example:
      path: /api/v1.2/statuses/728341901556629504/collected_by
    responses:
      - status: 200
        body:
          status_id: "728341901556629504"
          removed: 2
      - status: 404
        body:
          error: Record not found

  - id: get-collection-settings
    method: GET
    path: /api/v1.2/collections/settings
    title: Get your collection settings
    description: Returns who may add your public posts to their collections.
    compat: pixelfed
    result: result
    returns: "an object with `can_collect` (`everyone`, `followers` or `nobody`) and `policies`, the values it can take."
    responses:
      - status: 200
        body:
          can_collect: everyone
          policies: [everyone, followers, nobody]

  - id: update-collection-settings
    method: PUT
    path: /api/v1.2/collections/settings
    title: Update your collection settings
    description: "Sets who may add your public posts to their collections: `everyone` (the default), `followers` (accounts that follow you) or `nobody`. It also applies to posts that are already in someone's collection: when the setting stops allowing that account, your posts drop out of its collections until the setting allows it again."
    compat: pixelfed
    result: result
    params:
      body:
        - name: can_collect
          type: string
          required: true
          desc: "`everyone`, `followers` or `nobody`."
    callout:
      text: "Remote accounts have no such setting, so for their posts only blocks apply. Your own collections are never affected by your setting."
    returns: "the updated settings, in the same shape as [Get your collection settings](/api/collections#get-collection-settings)."
    example:
      body:
        can_collect: followers
    responses:
      - status: 200
        body:
          can_collect: followers
          policies: [everyone, followers, nobody]
      - status: 422
        body:
          message: The selected can collect is invalid.
          errors:
            can_collect: [The selected can collect is invalid.]

  - id: list-collections
