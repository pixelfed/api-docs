title: Notifications
description: Follows, likes, shares, comments and mentions, newest first.
icon: bell
section: resources
order: 6
endpoints:
  - id: list-notifications
    method: GET
    path: /api/v1/notifications
    title: List notifications
    description: "Returns your notifications, newest first, in the Mastodon shape. Pixelfed types are mapped to Mastodon ones: comments and photo tags arrive as `mention`, shares as `reblog` and likes as `favourite`. Notifications Mastodon has no type for (direct messages, story reactions, moderation notices) are left out, as are any whose post or account was deleted."
    compat: mastodon
    scope: read
    result: notifications
    params:
      query:
        - name: limit
          type: integer
          desc: "Notifications per page. Defaults to 20, capped at 40."
        - name: max_id
          type: string
          desc: Return notifications older than this ID.
        - name: min_id
          type: string
          desc: Return notifications newer than this ID.
        - name: since_id
          type: string
          desc: Return notifications newer than this ID. Takes priority over `min_id`.
        - name: "types[]"
          type: array of strings
          desc: "Only return these types. Any of `mention`, `reblog`, `favourite`, `follow`, `follow_request`, `poll` or `status`. Filtering happens server side while paging, so sparse types still fill a page."
    callout:
      icon: information-circle
      text: "`exclude_types[]` is not supported and is ignored, as is the singular `type`. To leave a type out, list the ones you want in `types[]`. The response is always Mastodon shaped, even with `_pe`."
    returns: "an array of Notification. Pages are linked in the `Link` header, see [Pagination](/api/pagination)."
    example:
      query:
        limit: 20
        "types[]": mention
    responses:
