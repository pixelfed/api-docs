title: Instance
description: Server information, limits and feature flags for a Pixelfed instance.
icon: server
section: resources
order: 1
endpoints:
  - id: get-instance-v2
    method: GET
    path: /api/v2/instance
    title: Get instance (v2)
    description: "Returns the server's name, version, upload limits, rules and contact account in the Mastodon v2 shape. The body is cached for 30 minutes, except `registrations`, which is read live on every request."
    compat: mastodon
    auth: false
    result: instance
    callout:
      icon: information-circle
      text: "Pixelfed does not offer polls or translation through this endpoint, so `polls` limits are all `0` and `translation.enabled` is `false`. `urls.streaming` is always `null`. Use [Get streaming config](/api/instance#get-streaming-config) instead."
    returns: an Instance.
    responses:
      - status: 200
        body:
          domain: pixelfed.social
          title: Pixelfed
          version: 3.5.3 (compatible; Pixelfed 0.15.0)
          source_url: https://github.com/pixelfed/pixelfed
          description: Photo sharing for everyone
          usage:
            users:
              active_month: 18342
          thumbnail:
            url: https://pixelfed.social/storage/headers/default.jpg
            blurhash: U4Rfh2-;fQ-;~qfQfQfQfQfQfQfQ~qfQfQfQ
            versions:
              "@1x": https://pixelfed.social/storage/headers/default.jpg
              "@2x": https://pixelfed.social/storage/headers/default.jpg
          languages: [en]
          configuration:
            urls:
              streaming: null
              status: null
            vapid:
              public_key: BEm0Vh3_6Yj4kq0WqD1y3x6m2t0cR7oNw9pL5aZbXcVdEfGhIjKlMnOpQrStUvWxYz01234567890abcdEFG
            accounts:
              max_featured_tags: 0
            direct_messages:
              max_characters: 2000
              max_media_attachments: 4
              group_chats:
                enabled: true
                max_participants: 10
            statuses:
              max_characters: 500
              max_media_attachments: 4
              characters_reserved_per_url: 23
            media_attachments:
              supported_mime_types: [image/jpeg, image/jpg, image/png, image/gif, video/mp4]
