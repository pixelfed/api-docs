  - id: get-instance-v1
    method: GET
    path: /api/v1/instance
    title: Get instance (v1)
    description: "The older Mastodon v1 shape of the same server information, kept for clients that have not moved to v2. It adds `stats` (local users, local posts and known domains, refreshed every 12 hours) and Pixelfed's `mobile_registration` flag. The whole body is cached for 30 minutes."
    compat: mastodon
    auth: false
    result: instance
    callout:
      icon: information-circle
      text: "The `polls` values here are hardcoded and do not mean Pixelfed accepts polls from this API. `urls.streaming_api` is always `null`."
    returns: an Instance in the v1 shape.
    responses:
      - status: 200
        body:
          uri: pixelfed.social
          title: Pixelfed
          short_description: Photo sharing for everyone
          description: Pixelfed is an image sharing platform, an ethical alternative to centralized platforms.
          email: admin@pixelfed.social
          version: 3.5.3 (compatible; Pixelfed 0.15.0)
          urls:
            streaming_api: null
          stats:
            user_count: 104218
            status_count: 2871405
            domain_count: 31877
          thumbnail: https://pixelfed.social/storage/headers/default.jpg
          languages: [en]
          registrations: true
          approval_required: false
          contact_account:
            id: "2"
            username: dansup
            acct: dansup
            display_name: dansup
          rules:
            - id: "1"
              text: Be kind. No harassment or hate speech.
          mobile_registration: true
          configuration:
            media_attachments:
              image_matrix_limit: 2073600
              image_size_limit: 15360000
